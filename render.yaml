# Render.com Blueprint Configuration
# Deploy both ChromaDB and FastAPI services

services:
  # ChromaDB Vector Database Service
  - type: web
    name: chromadb
    env: docker
    dockerfilePath: ./Dockerfile.chroma
    dockerContext: .
    plan: starter  # $7/month
    envVars:
      - key: IS_PERSISTENT
        value: TRUE
      - key: ANONYMIZED_TELEMETRY
        value: FALSE
    healthCheckPath: /api/v1/heartbeat
    autoDeploy: false

  # FastAPI Backend Service (Gemini FileSearch)
  - type: web
    name: chatbot-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter  # $7/month
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_STORE_ID
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: SECRET_KEY
        sync: false  # Set manually in Render dashboard (used if ADMIN_SECRET_KEY not set)
      - key: ADMIN_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://www.slrloungeworkshops.com,https://slrloungeworkshops.com
    healthCheckPath: /api/health
    autoDeploy: false

